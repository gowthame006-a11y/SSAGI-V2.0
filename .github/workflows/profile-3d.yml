name: Build 3D profile dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_profile_3d.py
      - .github/workflows/profile-3d.yml
permissions:
  contents: write
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render actual public contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_profile_3d.py
      - name: Save dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/profile-3d.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: render 3D GitHub contribution dashboard"
          git push
