name: Refresh profile metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - scripts/profile_metrics.py
      - .github/workflows/profile-metrics.yml
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate public metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USER: gowthame006-a11y
        run: python3 scripts/profile_metrics.py
      - name: Commit refreshed metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh public profile metrics"
          git push
